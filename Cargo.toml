[package]
name = "fluentkey"
version = "0.1.0"
edition = "2021"
description = "A quiet Windows tray companion for natural English"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3.6"
directories = "6"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
global-hotkey = "0.6"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.19"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_System_Memory"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
